<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Shield Glow -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144a39"/>
      <stop offset="50%" stop-color="#0a2a20"/>
      <stop offset="100%" stop-color="#051711"/>
    </linearGradient>

    <!-- Vibrant Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#ffd043"/>
      <stop offset="70%" stop-color="#e8981c"/>
      <stop offset="100%" stop-color="#b86904"/>
    </linearGradient>

    <!-- Vibrant Emerald Growth Gradient -->
    <linearGradient id="emeraldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow & 3D Shadow Filters -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffd043" flood-opacity="0.25"/>
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Emblem Monogram (Crest) -->
  <g transform="translate(14, 10)" filter="url(#badgeShadow)">
    <!-- Outer Shield Frame -->
    <path d="M45 4 L78 20 L78 54 C78 72 63 83 45 88 C27 83 12 72 12 54 L12 20 Z" 
          fill="url(#shieldBg)" 
          stroke="url(#goldGradient)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Inner Shield Accent Rim -->
    <path d="M45 11 L71 24 L71 52 C71 66 59 75 45 79 C31 75 19 66 19 52 L19 24 Z" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.12)" 
          stroke-width="1.5"/>

    <!-- Interlocking Wealth Coin Circles -->
    <circle cx="45" cy="48" r="22" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="3 2" fill="none" opacity="0.6"/>
    <circle cx="45" cy="48" r="15" fill="rgba(16, 185, 129, 0.15)" stroke="url(#emeraldGradient)" stroke-width="1.5"/>

    <!-- Dynamic Rocket/Growth Arrow Surging Upward -->
    <path d="M22 62 L38 46 L48 54 L68 26" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.9"/>
    <path d="M22 60 L38 44 L48 52 L70 24" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="4" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Arrowhead -->
    <polygon points="60,22 74,21 72,35" fill="url(#goldGradient)" stroke="#fff" stroke-width="0.8"/>

    <!-- Sparkle Diamond -->
    <g transform="translate(45, 26)" filter="url(#sparkleGlow)">
      <polygon points="0,-6 2,0 8,2 2,4 0,10 -2,4 -8,2 -2,0" fill="#ffffff"/>
    </g>
  </g>

  <!-- 2. Typography & Brand Badging -->
  <g transform="translate(112, 18)">
    <!-- Wordmark "Imali" -->
    <text x="0" y="44" 
          font-family="'Fraunces', 'DM Sans', Georgia, serif" 
          font-weight="900" 
          font-size="42" 
          fill="#f8fafc" 
          letter-spacing="-0.03em">
      Imali
    </text>

    <!-- Radiant "SMART" Pill Badge -->
    <g transform="translate(122, 12)">
      <rect x="0" y="0" width="88" height="32" rx="8" fill="url(#goldGradient)" filter="url(#badgeShadow)"/>
      <rect x="1" y="1" width="86" height="30" rx="7" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
      <text x="44" y="21" 
            font-family="'DM Sans', system-ui, -apple-system, sans-serif" 
            font-weight="900" 
            font-size="15" 
            fill="#0f172a" 
            text-anchor="middle" 
            letter-spacing="0.12em">
        SMART
      </text>
    </g>

    <!-- Sub-heading / Value Proposition -->
    <g transform="translate(2, 68)">
      <text x="0" y="0" 
            font-family="'DM Sans', system-ui, sans-serif" 
            font-weight="700" 
            font-size="11.5" 
            fill="#34d399" 
            letter-spacing="0.14em">
        WEALTH &amp; CASH FLOW INTELLIGENCE
      </text>
      <!-- Horizontal Micro Accent Line -->
      <line x1="255" y1="-3" x2="330" y2="-3" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
